<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <div class="display">
            <div class="previous-value"></div>
            <div class="current-value">0</div>
        </div>

        <div class="buttons">
            <button>AC</button>
            <button>±</button>
            <button>%</button>
            <button>÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button class="zero">0</button>
            <button>,</button>
            <button>=</button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
